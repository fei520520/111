<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>First Sight · 视觉助手</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/motion-vio-bridge.js"></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="app-header">
      <h1>First Sight</h1>
      <span class="muted">视觉助手</span>
    </header>

    <section id="login-panel" class="card">
      <label for="passcode">体验口令</label>
      <div class="inline">
        <input id="passcode" type="password" autocomplete="current-password" placeholder="输入体验口令">
        <button id="login-button" class="primary">进入</button>
      </div>
      <p id="login-status" class="status" aria-live="polite"></p>
      <p class="muted">进入后会依次请求摄像头与运动传感器权限。</p>
    </section>

    <section id="app-panel" hidden>
      <section class="card camera-card">
        <div class="video-wrap">
          <video id="camera" autoplay muted playsinline></video>
          <div id="camera-placeholder" class="placeholder">摄像头尚未开启</div>
          <div id="live-badge" class="live-badge" hidden>LIVE</div>
        </div>
      </section>

      <section class="card ask-card">
        <div class="ask-row">
          <button id="mic-button" class="primary icon" title="语音助手开关（登录后自动开启）">🎤</button>
          <input id="goal" type="text" maxlength="2000" placeholder="问点什么，或按 🎤 说话">
          <button id="ask-button" class="primary" disabled>发送</button>
        </div>
        <div id="output" class="output" aria-live="polite">回答会显示在这里。</div>
        <div class="ask-tools">
          <label class="inline"><input type="checkbox" id="speak-toggle" checked> 🔊 语音播报</label>
          <label class="inline" title="开启后按固定节奏单独看一次画面，只判断危险，不计入后台观察的调用预算"><input type="checkbox" id="hazard-watch-toggle"> ⚠ 危险检测</label>
          <button id="tts-test-button" class="secondary">🔊 测试播报</button>
          <button id="hazard-button" class="secondary">⚠ 模拟危险</button>
          <button id="arbiter-demo-button" class="secondary">调度演示</button>
          <button id="watch-button" class="secondary" disabled>关注这个情况</button>
          <button id="stop-task-button" class="secondary" disabled>结束</button>
        </div>
        <div class="scene-lines">
          <span>场景 <b id="scene-status">未开始</b></span>
          <span>变化 <b id="change-status">未开始</b></span>
          <span>危险 <b id="hazard-status">未开始</b></span>
        </div>
        <p id="voice-status" class="muted" aria-live="polite"></p>
        <p id="task-status" class="muted" aria-live="polite"></p>
        <input id="auto-analyze" type="checkbox" hidden>
        <div class="button-row">
          <button id="camera-button" class="secondary">开启/关闭摄像头</button>
          <button id="capture-button" class="secondary" disabled>抓拍一帧</button>
        </div>

        <details class="advanced-settings">
          <summary>更多</summary>
          <div class="settings-grid">
            <label>手动分析帧数
              <select id="frame-count"><option value="1">1 帧</option><option value="4" selected>4 帧</option><option value="8">8 帧</option></select>
            </label>
          </div>
          <button id="auto-observe-button" class="advanced-toggle" disabled>暂停后台记录</button>
          <div class="buffer-line"><span>最近截图缓冲区</span><span id="buffer-count">0 / 32</span></div>
          <div id="diagnostics" class="diagnostics"></div>
          <div id="thumbnails" class="thumbnails"></div>
          <p class="probe-link"><a href="/vio">VIO 探针</a> · <a href="/report">轨迹报告</a></p>
        </details>
      </section>

      <details class="card result-details">
        <summary>本次结果 / 反馈</summary>
        <section id="result-card" hidden>
          <div class="result-heading"><h2>本次结果</h2><span id="latency" class="pill"></span></div>
          <div id="decision" class="decision"></div>
          <p id="response" class="response"></p>
          <div id="observations" class="observations"></div>
          <section id="motion-timeline" class="motion-timeline" hidden>
            <h3>运动时间段（传感器估计）</h3>
            <div id="motion-timeline-items"></div>
            <p class="timeline-note">位移与方向是估计线索；浏览器没有提供绝对位置。</p>
          </section>
          <details><summary>模型原始决策</summary><pre id="raw-decision"></pre></details>
          <div class="feedback-grid">
            <label>识图正确<select data-feedback="perceptionCorrect"><option value="">未标注</option><option value="true">是</option><option value="false">否</option></select></label>
            <label>位置正确<select data-feedback="positionCorrect"><option value="">未标注</option><option value="true">是</option><option value="false">否</option></select></label>
            <label>该不该回答<select data-feedback="decisionCorrect"><option value="">未标注</option><option value="true">是</option><option value="false">否</option></select></label>
            <label>回答内容正确<select data-feedback="responseCorrect"><option value="">未标注</option><option value="true">是</option><option value="false">否</option></select></label>
            <label>对用户有帮助<select data-feedback="useful"><option value="">未标注</option><option value="true">是</option><option value="false">否</option></select></label>
          </div>
          <textarea id="feedback-notes" rows="2" maxlength="1000" placeholder="备注（可选）"></textarea>
          <button id="save-feedback-button">保存反馈</button>
          <p id="feedback-status" class="status" aria-live="polite"></p>
        </section>
      </details>

      <p id="app-status" class="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
